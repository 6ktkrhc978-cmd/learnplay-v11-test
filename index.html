<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5b55d6"><link rel="manifest" href="manifest.json">
<title>Learn & Play v11</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#20233d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial}.app{max-width:900px;margin:auto;padding:12px}header{background:linear-gradient(135deg,#5751d0,#746ee9);color:white;padding:20px;border-radius:24px;margin-bottom:12px}.brand{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:22px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}button{font:inherit;border:0;border-radius:14px;padding:11px 15px;font-weight:700;cursor:pointer}.nav{background:#ffffff25;color:#fff}.active{background:#fff;color:#5751d0}.card{background:#fff;border:1px solid #e4e5ef;border-radius:22px;padding:18px;margin:12px 0}.btn{background:#5b55d6;color:#fff}.alt{background:#efefff;color:#5b55d6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select,.field textarea{padding:12px;border:1px solid #ddd;border-radius:12px;font:inherit}.field textarea{min-height:80px}.media{padding:14px;border:2px dashed #d8d7f7;border-radius:16px;margin:12px 0}.preview{max-width:100%;max-height:220px;border-radius:14px;margin-top:10px}.option{display:block;width:100%;text-align:right;background:#fff;border:2px solid #e2e3ed;margin:8px 0}.selected{border-color:#5b55d6;background:#f0efff}.pill{display:inline-block;background:#efefff;color:#5b55d6;padding:5px 9px;border-radius:99px;font-size:13px}.muted{color:#74788f}.hide{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="app">
<header><div class="brand"><div><h1>Learn & Play</h1><div>محرر الأنشطة التفاعلية — v11</div></div><div class="logo">L&P</div></div>
<nav><button class="nav active" onclick="page('home',this)">الرئيسية</button><button class="nav" onclick="page('editor',this)">محرر النشاط 🎨</button><button class="nav" onclick="page('student',this)">وضع الطالب 👨‍🎓</button></nav></header>
<main id="main"></main></div>
<script>
const K='lp_v11',D={activities:[{id:1,title:'مطابقة الصور',desc:'نشاط تجريبي',image:'',audio:'',qs:[['ما الذي يطابق 🍎؟',['🍎 تفاحة','🍌 موز','🚗 سيارة'],0],['ما الذي يطابق 🐟؟',['🐱 قطة','🐟 سمكة','🌳 شجرة'],1],['ما الذي يطابق 🚗؟',['🚗 سيارة','🍎 تفاحة','🐟 سمكة'],0]]}]};
let db=JSON.parse(localStorage.getItem(K)||'null')||D,cur=null,answers={};
function save(){localStorage.setItem(K,JSON.stringify(db))}
function page(p,b){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(p==='editor')editor();else if(p==='student')student();else home()}
function home(){main.innerHTML='<div class="card"><h2>🎨 أنشطة متعددة الحواس</h2><p class="muted">أضيفي صورة وصوت وأسئلة تفاعلية، ثم جربي النشاط في وضع الطالب.</p><button class="btn" onclick="editor()">+ إنشاء نشاط</button></div><div class="grid">'+db.activities.map(a=>`<div class="card"><h3>${esc(a.title)}</h3><p>${esc(a.desc||'')}</p><span class="pill">${a.qs.length} أسئلة</span></div>`).join('')+'</div>'}
function editor(){let a=cur||{title:'',desc:'',image:'',audio:'',qs:[['',['','',''],0]]};main.innerHTML=`<div class="card"><h2>محرر نشاط حقيقي 🎨</h2>
<div class="field"><label>عنوان النشاط</label><input id="t" value="${esc(a.title)}"></div>
<div class="field"><label>التعليمات</label><textarea id="d">${esc(a.desc||'')}</textarea></div>
<div class="media"><b>🖼️ صورة</b><input id="im" type="file" accept="image/*"><img id="ip" class="preview ${a.image?'':'hide'}" src="${a.image}"></div>
<div class="media"><b>🔊 صوت</b><input id="au" type="file" accept="audio/*"><audio id="ap" class="${a.audio?'':'hide'}" controls src="${a.audio}"></audio></div>
<div id="qs"></div><button class="alt" onclick="addq()">+ إضافة سؤال</button>
<div style="margin-top:14px"><button class="btn" onclick="saveA()">حفظ النشاط</button></div></div>`;
renderQs(a.qs); document.getElementById('im').onchange=e=>read(e.target,'ip');document.getElementById('au').onchange=e=>read(e.target,'ap')}
function renderQs(list){window.qs=JSON.parse(JSON.stringify(list||[]));const box=document.getElementById('qs');if(!box)return;box.innerHTML=window.qs.map((q,i)=>`<div class="card"><b>السؤال ${i+1}</b><div class="field"><input value="${esc(q[0])}" oninput="window.qs[${i}][0]=this.value" placeholder="اكتبي السؤال"></div>${q[1].map((o,j)=>`<div><input value="${esc(o)}" style="padding:9px;width:70%" oninput="window.qs[${i}][1][${j}]=this.value"><label><input type="radio" name="q${i}" ${q[2]===j?'checked':''} onchange="window.qs[${i}][2]=${j}"> صحيحة</label></div>`).join('')}</div>`).join('')}
function addq(){if(!Array.isArray(window.qs))window.qs=[];window.qs.push(['',['','',''],0]);renderQs(window.qs)}
function read(inp,prev){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{inp.dataset.data=r.result;let x=document.getElementById(prev);x.src=r.result;x.classList.remove('hide')};r.readAsDataURL(f)}
function saveA(){let old=cur||{};let a={id:old.id||Date.now(),title:t.value||'نشاط جديد',desc:d.value,image:im.dataset.data||old.image||'',audio:au.dataset.data||old.audio||'',qs:(window.qs||[])};let i=db.activities.findIndex(x=>x.id===a.id);if(i<0)db.activities.push(a);else db.activities[i]=a;save();cur=null;alert('تم حفظ النشاط ✅');home()}
function student(){let a=db.activities[0];cur=a;answers={};main.innerHTML=`<div class="card"><h2>${esc(a.title)} 🎯</h2>${a.image?`<img class="preview" src="${a.image}">`:''}${a.audio?`<audio style="width:100%" controls src="${a.audio}"></audio>`:''}<p class="muted">${esc(a.desc||'')}</p>${a.qs.map((q,i)=>`<div class="card"><h3>${i+1}. ${esc(q[0])}</h3>${q[1].map((o,j)=>`<button class="option" onclick="pick(${i},${j},this)">${esc(o)}</button>`).join('')}</div>`).join('')}<button class="btn" onclick="submit()">✅ تسليم النشاط</button></div>`}
function pick(i,j,b){answers[i]=j;b.parentNode.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}
function submit(){let n=0;cur.qs.forEach((q,i)=>{if(answers[i]===q[2])n++});alert('تم تسليم النشاط 🎉 النتيجة: '+n+'/'+cur.qs.length)}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
home()
</script></body></html>
